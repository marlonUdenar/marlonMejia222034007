<div class="mainForm">
    <div class="formInput">
        <p>Email</p>
        <input type="text" pInputText [(ngModel)]="user" placeholder="type your email"/>
        <p>Password</p>
        <p-password [(ngModel)]="password" [toggleMask]="true" placeholder="type your password"/>
    </div>

    <div class="fomrButton">
        <p-button label="Cancel" severity="secondary" class="w-full" styleClass="w-full" />
        <p-button label="Save" class="w-full" styleClass="w-full" />
    </div>
    
    <div class="formFooter">
        <p>Not a Member?</p>
        <a href="" >Register</a>
    </div>
</div>

<div class="p-fluid">    
    <form [formGroup] ="loginForm" (ngSubmit)="onSubmit()">
        <div class="P-field">
            <div class="formLoginPage">
                <p-card header="Login" [style]="{maxwidth:'400px'}" >
                    <div class="mainForm">
                        <div class="formInput">
                            <p>Email</p>
                            <input  id="email" type="email" pInputText  name="email" 
                                    formControlName="email" placeholder="type your email"/>
                            <div *ngIf="loginForm.controls['email'].invalid && loginForm.controls['email'].touched" class="error">
                                El email es requerido
                            </div>
                            <p>Password</p>
                            <p-password  id="password" type="password"  formControlName="password" placeholder="type your password" class="w-full" styleClass="w-full" ></p-password>
                        </div>
                    
                        <div class="formButton">
                            <p-button label="Login" class="reg" styleClass="w-full" />
                            
                        </div>
                        
                        <div class="formFooter">
                            <p>Not a Member?</p>
                            <a href="">Register</a>
                        </div>
                    </div>
                </p-card>
            </div>
        </div>
    </form>
</div>
